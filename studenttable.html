<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="student">
        <!-- headers -->
        <header id="up">
            <h1>Academie de Saint Denis</h1>
        </header>
        
        <!-- nav bar -->
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="studenttable.html"> Tableau des eleves</a>
            <a href="teachers.html">Tableau des professeurs</a>
            <a href="admin.html">Tableau de l'administration</a>
            <a href="index.html">Logout</a>
        </nav>

        <!-- saint denis table student -->
        <div>
            <span>
                <h2>Tableau des eleves</h2>
            </span>
            <span>
                <button id="button_event" onclick="getEleves()">Ok</button>
                <p id="demo"></p>
            </span>
        </div>
        
        <div>        
            <table>
                <thead>
                    <th v-for="header in headers" :key="header">
                        {{ header }}
                    </th>
                    
                    
                </thead>
                <tbody>
                <!-- api -->
                 <tr v-for="eleve in eleves" :key="eleve.id">
                    <td>{{ eleve.firstname }}</td>
                    <td>{{ eleve.lastname }}</td>
                    <td>{{ eleve.gender }}</td>
                    <td>{{ eleve.birthdate }}</td>
                    <td>{{ eleve.classes }}</td>
                    <td>{{ eleve.creation_date }}</td> 
                 </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="student.js"></script>
</body>
</html>
