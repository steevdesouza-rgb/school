<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div id="dashboard">
      <!-- headers -->
      <header id="up">
         <h1>Academie de Saint Denis</h1>
      </header>
      
      <!-- nav bar -->
      <nav>
         <a href="dashboard.html">Dashboard</a>
         <a href="studenttable.html"> Tableau des eleves</a>
         <a href="teachers.html">Tableau des professeurs</a>
         <a href="admin.html">Tableau de l'administration</a>
         <a href="index.html">Logout</a>
      </nav>

      <div>
         <h2>Dashboard</h2>
         <button onclick="getNum()">refresh</button>
      </div>

      <div>
            <table>
               <thead v-for="header in headers" :key="header">
                     <th>
                        {{ header }}
                     </th>
               </thead>

               <tbody>
                  <tr>
                     <td>{{ Arrays.Eleves }}</td>
                     <td>{{ Arrays.Professeurs }}</td>
                     <td>{{ Arrays.Administrations }}</td>
                     <td>{{ Arrays.Classes }}</td>
                  </tr>
               </tbody>
         </table>
      </div>
   </div>
     
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
