<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academie Saint Denis</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <!-- headers -->
        <header id="up">
        <h1>Academie de Saint Denis</h1>
        </header>

        <div id="hello">
            <h2>Login</h2>
            <form>
                <label for="name">Name:</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required
                    minlength="5"
                    maxlength="10"
                    v-model="username"
                /><br><br>
                <label for="password">Password:</label>
                <input
                    type="password" 
                    id="password" 
                    name="password"
                    v-model="password" 
                    required
                /><br><br>
                <!-- <input 
                    type="submit" 
                    value="Login"
                /> -->
                <a href="/dashboard.html" class="button">login</a>
            </form>
            <button @click="login">Login</button>
        </div> 
        </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="index.js" ></script>
    <script src="app.js" ></script>
</body>
</html>
